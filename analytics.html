<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analytics & Timetable</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>📊 Analytics & Timetable</h1>

<nav class="navigation">
  <a href="index.html">Tracker</a>
  <a href="analytics.html" class="active">Analytics & Timetable</a>
</nav>

<div class="container">
    <div class="timetable-header">
        <h2>Weekly Timetable</h2>
        <div>
            <button id="editBtn">Edit Timetable</button>
            <button id="saveBtn" class="save-btn hidden">Save Changes</button>
        </div>
    </div>
    <p style="text-align:center; font-size:0.9em; color:#aaa;">Click 'Edit Timetable' to make changes to your schedule.</p>
    
    <div class="timetable-container">
        <table id="timetable" class="timetable">
            <thead>
                <tr>
                    <th>Time</th>
                    <th>Monday</th>
                    <th>Tuesday</th>
                    <th>Wednesday</th>
                    <th>Thursday</th>
                    <th>Friday</th>
                </tr>
            </thead>
            <tbody>
                </tbody>
        </table>
    </div>
</div>

<div class="container">
    <h2>Overall Attendance Chart</h2>
    <canvas id="attendanceChart"></canvas>
</div>

<div id="alertModal" class="modal-overlay hidden">
    <div class="modal-content">
        <h2>Success!</h2>
        <p>Your timetable has been saved successfully.</p>
        <div class="modal-buttons">
            <button id="alertOkBtn" class="save-btn">OK</button>
        </div>
    </div>
</div>

<script src="analytics.js"></script>

</body>
</html>
