<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analytics & Timetable</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  body {
    font-family: 'Segoe UI', sans-serif;
    background-color: #0d0d0d;
    color: white;
    margin: 0;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h1, h2 {
    text-align: center;
  }
  .container {
    width: 100%;
    max-width: 800px;
    background-color: #1a1a1a;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 20px;
  }
  .navigation {
    display: flex;
    gap: 5px;
    background-color: #1a1a1a;
    padding: 5px;
    border-radius: 10px;
    margin-bottom: 20px;
  }
  .navigation a {
    color: white;
    text-decoration: none;
    padding: 8px 15px;
    border-radius: 8px;
    transition: background-color 0.2s ease;
  }
  .navigation a:hover {
    background-color: #333;
  }
  .navigation a.active {
    background-color: #1db954;
    font-weight: bold;
  }
  .timetable-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
  }
  .timetable-header h2 {
    margin: 0;
  }
  .timetable-header button {
    background-color: #ffc107;
    color: black;
    border: none;
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
  }
  .timetable-header button.save-btn {
      background-color: #28a745;
      color: white;
  }
  .timetable {
    width: 100%;
    border-collapse: collapse;
  }
  .timetable th, .timetable td {
    border: 1px solid #444;
    padding: 10px;
    text-align: center;
    min-width: 80px;
  }
  .timetable th {
    background-color: #333;
  }
  .editable-cell {
    background-color: #2c3e50;
    cursor: cell;
  }
  .editable-cell:focus {
    background-color: #3498db;
    color: white;
    outline: 2px solid #fff;
  }
  .modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.7);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1000;
  }
  .modal-content {
    background-color: #2a2a2a;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    width: 90%;
    max-width: 350px;
    display: flex;
    flex-direction: column;
    gap: 15px;
  }
  .modal-content h2 { margin: 0; text-align: center; }
  .modal-content p { margin: 0; text-align: center; line-height: 1.5; }
  .modal-buttons { display: flex; gap: 10px; justify-content: center; }
  .modal-buttons button { padding: 10px; font-size: 1em; flex: 0.5; }
  .hidden {
      display: none;
  }
</style>
</head>
<body>

<h1>📊 Analytics & Timetable</h1>

<nav class="navigation">
  <a href="index.html">Tracker</a>
  <a href="analytics.html" class="active">Analytics & Timetable</a>
</nav>

<div class="container">
    <div class="timetable-header">
        <h2>Weekly Timetable</h2>
        <div>
            <button id="editBtn">Edit Timetable</button>
            <button id="saveBtn" class="save-btn hidden">Save Changes</button>
        </div>
    </div>
    <p style="text-align:center; font-size:0.9em; color:#aaa;">Click 'Edit Timetable' to make changes to your schedule.</p>
    <table id="timetable" class="timetable">
        <thead>
            <tr>
                <th>Time</th>
                <th>Monday</th>
                <th>Tuesday</th>
                <th>Wednesday</th>
                <th>Thursday</th>
                <th>Friday</th>
            </tr>
        </thead>
        <tbody>
            </tbody>
    </table>
</div>

<div class="container">
    <h2>Overall Attendance Chart</h2>
    <canvas id="attendanceChart"></canvas>
</div>

<div id="alertModal" class="modal-overlay hidden">
    <div class="modal-content">
        <h2>Success!</h2>
        <p>Your timetable has been saved successfully.</p>
        <div class="modal-buttons">
            <button id="alertOkBtn" class="save-btn">OK</button>
        </div>
    </div>
</div>

<script>
// The JavaScript does not need to be changed at all for this reordering.
// All functions and listeners remain the same.

// --- PART 1: ATTENDANCE CHART ---
function renderAttendanceChart() {
    const subjects = JSON.parse(localStorage.getItem('subjects')) || [];
    const ctx = document.getElementById('attendanceChart').getContext('2d');
    if (subjects.length === 0) {
        ctx.font = "16px Segoe UI"; ctx.fillStyle = "#aaa"; ctx.textAlign = "center";
        ctx.fillText("No subject data to display. Add subjects on the Tracker page.", ctx.canvas.width / 2, 50);
        return;
    }
    const labels = subjects.map(s => s.name);
    const dataPoints = subjects.map(s => {
        const presentCount = s.history.filter(h => h.status === 'present').length;
        const totalCount = s.history.length;
        return totalCount > 0 ? Math.round((presentCount / totalCount) * 100) : 0;
    });
    const goal = parseInt(localStorage.getItem('attendanceGoal')) || 75;
    new Chart(ctx, {
        type: 'bar', data: { labels: labels,
            datasets: [{ label: 'Attendance %', data: dataPoints,
                backgroundColor: dataPoints.map(p => p >= goal ? 'rgba(40, 167, 69, 0.7)' : 'rgba(255, 193, 7, 0.7)'),
                borderColor: dataPoints.map(p => p >= goal ? 'rgba(40, 167, 69, 1)' : 'rgba(255, 193, 7, 1)'),
                borderWidth: 1 }] },
        options: { scales: { y: { beginAtZero: true, max: 100, ticks: { color: '#fff' } }, x: { ticks: { color: '#fff' } } },
            plugins: { legend: { labels: { color: '#fff' } } } }
    });
}

// --- PART 2: EDITABLE TIMETABLE ---
const timetableBody = document.getElementById('timetable').getElementsByTagName('tbody')[0];
const editBtn = document.getElementById('editBtn');
const saveBtn = document.getElementById('saveBtn');
const alertModal = document.getElementById('alertModal');
const alertOkBtn = document.getElementById('alertOkBtn');

const defaultTimeSlots = ["9-10 AM", "10-11 AM", "11-12 PM", "12-1 PM", "1-2 PM", "2-3 PM"];
let timeSlots = JSON.parse(localStorage.getItem('timeSlotsData')) || defaultTimeSlots;
let scheduleData = JSON.parse(localStorage.getItem('scheduleData')) || {};

const days = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"];

function setTableEditable(isEditable) {
    const cells = timetableBody.getElementsByTagName('td');
    for (const cell of cells) {
        cell.contentEditable = isEditable;
        if (isEditable) {
            cell.classList.add('editable-cell');
        } else {
            cell.classList.remove('editable-cell');
        }
    }
    editBtn.classList.toggle('hidden', isEditable);
    saveBtn.classList.toggle('hidden', !isEditable);
}

function saveTimetable() {
    const newTimeSlots = [];
    const newScheduleData = {};
    const rows = timetableBody.getElementsByTagName('tr');

    for (let i = 0; i < rows.length; i++) {
        const cells = rows[i].getElementsByTagName('td');
        newTimeSlots.push(cells[0].textContent.trim());
        for (let j = 1; j < cells.length; j++) {
            const key = `${i}-${j-1}`;
            newScheduleData[key] = cells[j].textContent.trim();
        }
    }
    
    timeSlots = newTimeSlots;
    scheduleData = newScheduleData;
    localStorage.setItem('timeSlotsData', JSON.stringify(timeSlots));
    localStorage.setItem('scheduleData', JSON.stringify(scheduleData));
    
    alertModal.classList.remove('hidden');
}

function renderTimetable() {
    timetableBody.innerHTML = '';
    timeSlots.forEach((time, rowIndex) => {
        const row = timetableBody.insertRow();
        const timeCell = row.insertCell();
        timeCell.textContent = time;

        days.forEach((day, colIndex) => {
            const cell = row.insertCell();
            const key = `${rowIndex}-${colIndex}`;
            cell.textContent = scheduleData[key] || '';
        });
    });
}

editBtn.addEventListener('click', () => setTableEditable(true));
saveBtn.addEventListener('click', () => {
    setTableEditable(false);
    saveTimetable();
});
alertOkBtn.addEventListener('click', () => alertModal.classList.add('hidden'));
alertModal.addEventListener('click', (event) => {
    if (event.target === alertModal) alertModal.classList.add('hidden');
});

// --- INITIALIZE THE PAGE ---
renderAttendanceChart();
renderTimetable();
</script>

</body>
</html>
