<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #000;
        color: white;
        margin: 0;
        padding: 0;
        text-align: center;
    }
    h1 {
        margin-top: 20px;
        font-size: 2.5rem;
    }
    .date {
        margin-bottom: 20px;
        font-size: 1.2rem;
        color: #bbb;
    }
    .container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px;
        padding: 20px;
    }
    .card {
        background-color: #111;
        padding: 20px;
        border-radius: 15px;
        width: 250px;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        box-shadow: 0 4px 8px rgba(0,0,0,0.5);
    }
    .card:hover {
        transform: scale(1.07);
        box-shadow: 0 8px 16px rgba(255,255,255,0.1);
    }
    button {
        margin: 5px;
        padding: 10px 15px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        background-color: #333;
        color: white;
        font-size: 0.9rem;
        transition: background-color 0.3s ease;
    }
    button:hover {
        background-color: #555;
    }
    .add-subject {
        margin: 20px;
    }
    input {
        padding: 10px;
        border-radius: 8px;
        border: none;
        outline: none;
        font-size: 1rem;
    }
    /* Popup Modal */
    .modal {
        display: none;
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0,0,0,0.8);
        justify-content: center;
        align-items: center;
        animation: fadeIn 0.4s ease;
    }
    .modal-content {
        background-color: #111;
        padding: 20px;
        border-radius: 15px;
        width: 350px;
        text-align: center;
    }
    @keyframes fadeIn {
        from {opacity: 0;}
        to {opacity: 1;}
    }
</style>
</head>
<body>

<h1>Attendance Tracker</h1>
<div class="date" id="todayDate"></div>

<div class="add-subject">
    <input type="text" id="subjectName" placeholder="Enter subject name">
    <button onclick="addSubject()">Add Subject</button>
</div>

<div class="container" id="subjectsContainer"></div>

<!-- Popup Modal -->
<div class="modal" id="statsModal">
    <div class="modal-content">
        <canvas id="statsChart"></canvas><br>
        <button onclick="closeModal()">Close</button>
    </div>
</div>

<script>
let subjects = [];
// Load from localStorage with migration support
function loadSubjects() {
    const stored = localStorage.getItem("subjects");
    if (stored) {
        try {
            const parsed = JSON.parse(stored);

            // If it's already in new format, just use it
            if (parsed.length && parsed[0].entries) {
                subjects = parsed;
            } else {
                // OLD FORMAT: convert to new format
                subjects = parsed.map(sub => ({
                    name: sub.name || "Unknown",
                    entries: [
                        ...Array(sub.presentCount || 0).fill({ date: "old", status: "Present" }),
                        ...Array(sub.absentCount || 0).fill({ date: "old", status: "Absent" })
                    ]
                }));
                saveSubjects();
            }
        } catch (e) {
            console.error("Error parsing saved data:", e);
            subjects = [];
        }
    }
}

function saveSubjects() {
    localStorage.setItem("subjects", JSON.stringify(subjects));
}

function renderSubjects() {
    const container = document.getElementById("subjects");
    container.innerHTML = "";

    subjects.forEach((subject, index) => {
        const presentCount = subject.entries.filter(e => e.status === "Present").length;
        const absentCount = subject.entries.filter(e => e.status === "Absent").length;

        const card = document.createElement("div");
        card.className = "subject-card";
        card.innerHTML = `
            <h2>${subject.name}</h2>
            <p>Present: ${presentCount}</p>
            <p>Absent: ${absentCount}</p>
            <button onclick="markAttendance(${index}, 'Present')">Present</button>
            <button onclick="markAttendance(${index}, 'Absent')">Absent</button>
            <button onclick="viewStats(${index})">View Stats</button>
        `;
        container.appendChild(card);
    });
}

function addSubject() {
    const nameInput = document.getElementById("subjectName");
    const name = nameInput.value.trim();
    if (name) {
        subjects.push({ name, entries: [] });
        saveSubjects();
        renderSubjects();
        nameInput.value = "";
    }
}

function markAttendance(index, status) {
    const today = new Date().toLocaleDateString("en-GB", {
        day: "numeric", month: "short", year: "numeric"
    });
    subjects[index].entries.push({ date: today, status });
    saveSubjects();
    renderSubjects();
}

let currentChart = null;

function viewStats(index) {
    const subject = subjects[index];
    const presentCount = subject.entries.filter(e => e.status === "Present").length;
    const absentCount = subject.entries.filter(e => e.status === "Absent").length;

    if (currentChart) currentChart.destroy();

    const ctx = document.getElementById("statsChart").getContext("2d");
    currentChart = new Chart(ctx, {
        type: 'pie',
        data: {
            labels: ['Present', 'Absent'],
            datasets: [{
                data: [presentCount, absentCount],
                backgroundColor: ['#4CAF50', '#F44336']
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: { labels: { color: 'white' } }
            }
        }
    });

    document.getElementById("statsModal").style.display = "flex";
}

function closeModal() {
    document.getElementById("statsModal").style.display = "none";
}

// Show today's date
document.getElementById("date").innerText = new Date().toLocaleDateString("en-GB", {
    day: "numeric", month: "short", year: "numeric"
});

loadSubjects();
renderSubjects();
</script>

</body>
</html>
